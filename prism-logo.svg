<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff5d73"/>
      <stop offset="16%" stop-color="#ff9e57"/>
      <stop offset="33%" stop-color="#ffd166"/>
      <stop offset="50%" stop-color="#7bd389"/>
      <stop offset="66%" stop-color="#4cc9f0"/>
      <stop offset="83%" stop-color="#5b7bf0"/>
      <stop offset="100%" stop-color="#b15bf0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Prism triangle: equilateral-ish, centered -->
  <polygon
    points="256,120 376,392 136,392"
    fill="rgba(255,255,255,.05)"
    stroke="url(#sg)"
    stroke-width="10"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <!-- Inner accent line (the beam entry hint) -->
  <line
    x1="186" y1="256" x2="246" y2="256"
    stroke="rgba(234,242,255,.65)"
    stroke-width="5"
    stroke-linecap="round"
  />
</svg>
